name: Compilar MallabiGPS 1.0.13 pruebas independientes
on:
  push:
    paths:
      - '.github/workflows/compilar-mallabigps.yml'
      - 'MallabiGPS-1.0.6-codigo-candidato.zip'
      - 'parches/1.0.7/**'
      - 'parches/1.0.10/**'
      - 'parches/1.0.11/**'
      - 'parches/1.0.12/**'
      - 'parches/1.0.13/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    if: github.repository == 'trabaku/MallabiGPS'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: MallabiGPS-integracion
    steps:
      - uses: actions/checkout@v4
      - name: Verificar y extraer codigo
        working-directory: .
        run: |
          test "$(git hash-object MallabiGPS-1.0.6-codigo-candidato.zip)" = 128b087e6e25cdd02a94f58fbb384d2c9033e629
          unzip -tq MallabiGPS-1.0.6-codigo-candidato.zip
          unzip -q MallabiGPS-1.0.6-codigo-candidato.zip
          python3 parches/1.0.7/aplicar.py
          git apply --directory=MallabiGPS-integracion parches/1.0.10/creador-btt.patch
          git apply --directory=MallabiGPS-integracion parches/1.0.11/buscar-rutas-en-mapa.patch
          git apply --directory=MallabiGPS-integracion parches/1.0.12/panel-alternativas.patch
          git apply --directory=MallabiGPS-integracion parches/1.0.13/solo-audio-pantalla-bloqueada.patch
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Comprobar SDK Android preinstalado
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - name: Pruebas de codigo
        run: |
          npm install --no-save --no-package-lock typescript@5.6.3 playwright
          export PATH="$PWD/node_modules/.bin:$PATH"
          npx playwright install --with-deps chromium
          node scripts/construye.cjs
          node scripts/construye.cjs --comprueba
          node scripts/revisa-tipos.cjs
          node --test --test-force-exit --test-timeout=30000 tests/*.test.cjs engine-mallabi/tests/*.test.cjs
          # MallabiGPS no anuncia una APK hasta publicarla. Probar ausencia
          # real del aviso y luego simular una publicación, sin tocar la app.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/test-browser.cjs')
          s = p.read_text()
          a = '      await pv.waitForSelector("#appUpdate:not(.hidden)", { timeout: 10000 });'
          b = '      const publicada = fs.readFileSync(path.join(root, "instalar.html"), "utf8").match(/<!--VER-->([\\d.]+)<!--\\/VER-->/)[1];'
          assert s.count(a) == 1 and s.count(b) == 1
          s = s.replace(a, '''      await pv.waitForTimeout(1500);
                assert(!(await pv.locator("#appUpdate").isVisible()), "sin APK publicada no se anuncia una actualización");
                const publicada = "9.9.9";
                await ctxV.route("**/instalar.html", r => r.fulfill({contentType:"text/html",body:"<!--VER-->" + publicada + "<!--/VER-->"}));
                await pv.reload();
                await pv.waitForSelector("#appUpdate:not(.hidden)", { timeout: 10000 });''').replace(b, '')
          p.write_text(s)
          PY
          node scripts/test-browser.cjs
          python3 scripts/test-native-turns.py
          for t in regression_tracking sin_senal_gps silencio background_lifecycle giros_limite grabaciones_borrar caida_sos barometro llegada fuera_ruta_igual tiempo_marcha informe_fallo; do python3 "tests/$t.py"; done
          python3 scripts/test-gasto-bateria.py
          python3 scripts/test-nombre-descarga.py
      - name: Compilar y verificar APK de pruebas
        env:
          KEY_B64: ${{ secrets.MALLABI_FIRMA_P12_BASE64 }}
          MALLABI_FIRMA_CLAVE: ${{ secrets.MALLABI_FIRMA_CLAVE }}
          MALLABI_FIRMA_ALIAS: ${{ secrets.MALLABI_FIRMA_ALIAS }}
        run: |
          set -euo pipefail
          unset MALLABI_FIRMA_OBLIGATORIA MALLABI_FIRMA_CLAVE MALLABI_FIRMA_ALIAS
          # APK de pruebas separada: Android exige una firma, se usa debug.
          # No puede sustituir la app instalada ni el navegador original.
          pkg=com.trabakutik.mallabigps.pruebas113
          name=MallabiGPS-1.0.13-pruebas
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=list(Path('android/app').glob('build.gradle*'))
          assert len(files)==1
          p=files[0]
          s=p.read_text()
          s,n=re.subn(r'(applicationId\s*(?:=\s*)?["\x27])com\.trabakutik\.mallabigps(?:\.pruebas)?(["\x27])',r'\g<1>com.trabakutik.mallabigps.pruebas113\2',s)
          assert n>=1
          s=re.sub(r'applicationIdSuffix\s*(?:=\s*)?["\x27][^"\x27]+["\x27]','',s)
          p.write_text(s)
          PY
          gradle -p android --no-daemon lintDebug assembleDebug
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/aapt" dump badging "$apk" | grep -F "package: name='$pkg'"
          "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -F "$pkg.fileprovider"
          mkdir -p dist
          cp "$apk" "dist/$name.apk"
          cd dist
          sha256sum *.apk > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MallabiGPS-1.0.13-APK-pruebas
          path: MallabiGPS-integracion/dist/
          if-no-files-found: error
      - name: Limpiar clave
        if: always()
        run: rm -f android/firma/mallabi.p12
  publicar-pruebas:
    if: github.repository == 'trabaku/MallabiGPS' && github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MallabiGPS-1.0.13-APK-pruebas
          path: dist
      - name: Publicar descarga directa de la APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256.txt
          tag="v1.0.13-pruebas-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" MallabiGPS-1.0.13-pruebas.apk SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "MallabiGPS 1.0.13 · APK de pruebas" \
            --notes "Quita el icono de bici y senderismo del mapa. Con la pantalla bloqueada, los giros se anuncian por voz y pitidos sin abrir una ficha. Instalación independiente de pruebas."
